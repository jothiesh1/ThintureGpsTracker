	   /* Mobile devices */
	  

	   /* Extra small devices */

			  <div class="mb-3">

		</div>
		
		<canvas id="realSpeedo" class="real-speedometer" width="200" height="200"></canvas>

	<div class="speedometer" id="speedometer"></div>

	<!-- Scripts -->
	<!-- Load in this order -->
	<!-- 1. Load Leaflet core FIRST -->
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<!-- 2. Load Leaflet rotated marker plugin AFTER Leaflet is defined -->
	<script src="https://cdn.jsdelivr.net/gh/bbecquet/Leaflet.RotatedMarker@0.2.0/leaflet.rotatedMarker.js"></script>

	<!-- 3. Then load other optional Leaflet plugins -->
	<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

	<!-- 4. Other dependencies 
		<div><strong>Speed:</strong> ${Math.round(speed)} km/h</div>
	 <div><strong>Speed:</strong> ${Math.round(firstPoint.speed || 0)} km/h</div> -->
	<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>



	<script>
		
		let lastDeviceId = null;
		let lastFrom = null;
		let lastTo = null;
		let movedDistance = 0;
		let lastLatLng = null;
		let totalDistance = 0;      // Total trip distance
		
		const map = L.map("map", {
		  center: [20.5937, 78.9629],
		  zoom: 5,
		  maxZoom: 19,            // ✅ Match tileLayer
		  scrollWheelZoom: true,
		  touchZoom: true,
		  zoomControl: false,
		  keyboard: true
		});

		L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
		  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
		  maxZoom: 19,            // ✅ Ensure tileLayer allows deep zoom
		  minZoom: 0
		}).addTo(map);




	  let polyline = null, marker = null, timer = null, index = 0, path = [], heatLayer = null;
	  let playbackSpeed = 1;
	  const idleMarkers = [];

	  const carIcon = L.icon({
	    iconUrl: '/THINTURE_IMAGE/car/green/car0.png',
	    iconSize: [40, 40],
	    iconAnchor: [20, 20],
	    popupAnchor: [0, -20]
	  });
	  function toggleSidebar(forceClose = false) {
	    const sidebar = document.getElementById("sidebar");
	    const plusBtn = document.getElementById("plusToggle");
	    const minusBtn = document.getElementById("minusToggle");

	    const isCollapsed = sidebar.classList.contains("collapsed");

	    if (forceClose || (!isCollapsed && window.innerWidth <= 1024)) {
	      // Collapse the sidebar
	      sidebar.classList.add("collapsed");
	      plusBtn.style.display = "flex";
	      minusBtn.style.display = "none";
	    } else {
	      // Expand the sidebar
	      sidebar.classList.remove("collapsed");
	      plusBtn.style.display = "none";
	      minusBtn.style.display = "flex";
	    }
	  }



	  window.addEventListener("DOMContentLoaded", () => {
	    const nowUTC = getCurrentLocalDateTimeString();

	    flatpickr("#fromTime", {
	      enableTime: true,
	      time_24hr: true,
	      dateFormat: "Y-m-d H:i:S",
	      allowInput: true,
	      // auto-close handled by Flatpickr itself
	    });

	    flatpickr("#toTime", {
	      enableTime: true,
	      time_24hr: true,
	      dateFormat: "Y-m-d H:i:S",
	      allowInput: true,
	      defaultDate: nowUTC
	      // auto-close handled by Flatpickr itself
	    });
	  

	 

		function getCurrentLocalDateTimeString() {
		  const now = new Date();
		  const yyyy = now.getFullYear();
		  const mm = String(now.getMonth() + 1).padStart(2, '0');
		  const dd = String(now.getDate()).padStart(2, '0');
		  const hh = String(now.getHours()).padStart(2, '0');
		  const mi = String(now.getMinutes()).padStart(2, '0');
		  const ss = String(now.getSeconds()).padStart(2, '0');
		  return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
		}




		 const sidebar = document.getElementById("sidebar");
		  const plusBtn = document.getElementById("plusToggle");
		  const minusBtn = document.getElementById("minusToggle");

		  function updateSidebarButtons() {
		    const isCollapsed = sidebar.classList.contains("collapsed");
		    plusBtn.style.display = isCollapsed ? "flex" : "none";
		    minusBtn.style.display = isCollapsed ? "none" : "flex";
		  }

		  // Initial load behavior
		  if (window.innerWidth <= 768) {
		     sidebar.classList.add("collapsed");
		   }

		  updateSidebarButtons();

		  // Unified click listener
		  document.getElementById("plusToggle").addEventListener("click", () => {
		    sidebar.classList.remove("collapsed");
		    updateSidebarButtons();
		  });

		  document.getElementById("minusToggle").addEventListener("click", () => {
		    sidebar.classList.add("collapsed");
		    updateSidebarButtons();
		  });
		});


	  function haversineDistance(lat1, lon1, lat2, lon2) {
	    const R = 6371; // km
	    const dLat = (lat2 - lat1) * Math.PI / 180;
	    const dLon = (lon2 - lon1) * Math.PI / 180;
	    const a = Math.sin(dLat / 2) ** 2 +
	              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
	              Math.sin(dLon / 2) ** 2;
	    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
	    return R * c;
	  }

	  function calculateTotalDistance(path) {
	    let total = 0;
	    for (let i = 1; i < path.length; i++) {
	      total += haversineDistance(
	        path[i - 1].latitude, path[i - 1].longitude,
	        path[i].latitude, path[i].longitude
	      );
	    }
	    return total.toFixed(2); // km
	  }

	  async function fetchTrip(deviceId, from, to) {
	    try {
	      const res = await fetch(`/api/vehicle/history/${deviceId}?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
	      if (!res.ok) throw new Error("API error");
	      const data = await res.json();
	      return data.filter(p => p.latitude && p.longitude && !isNaN(p.latitude) && !isNaN(p.longitude));
	    } catch (e) {
			Swal.fire({
			  icon: 'warning',         // or 'error', 'info', 'success'
			  text: 'Failed to load trip data.',
			  toast: true,
			  position: 'center',
			  showConfirmButton: false,
			  timer: 3000,
			  timerProgressBar: true,
			  customClass: {
			    popup: 'swal-sm-mobile'
			  }
			});

	      console.error(e);
	      return [];
	    }
	  }



	  async function loadTripFromInputs(forceReload = false) {
	    const deviceId = document.getElementById("deviceId").value.trim();
	    const from = document.getElementById("fromTime").value.trim();
	    const to = document.getElementById("toTime").value.trim();
	    const mode = document.getElementById("polylineMode").value;

	    if (!deviceId || !from || !to) {
	      Swal.fire({
	        icon: 'warning',
	        text: 'Please enter all fields.',
	        toast: true,
	        position: 'center',
	        showConfirmButton: false,
	        timer: 3000,
	        timerProgressBar: true,
	        customClass: {
	          popup: 'swal-sm-mobile'
	        }
	      });
	      return;
	    }

	    if (!forceReload && deviceId === lastDeviceId && from === lastFrom && to === lastTo) {
	      console.log("Same input, skipping reload...");
	      return;
	    }

	    lastDeviceId = deviceId;
	    lastFrom = from;
	    lastTo = to;

	    document.getElementById("togglePlayPause").innerHTML = "Loading...";

	    try {
	      path = await fetchTrip(deviceId, from, to);

	      if (!path.length) {
	        Swal.fire({
	          icon: 'info',
	          text: 'No data found.',
	          toast: true,
	          position: 'center',
	          showConfirmButton: false,
	          timer: 3000,
	          timerProgressBar: true,
	          customClass: {
	            popup: 'swal-sm-mobile'
	          }
	        });
	        document.getElementById("togglePlayPause").innerHTML = "▶ Play";
	        return;
	      }

	      // ✅ Clear old markers and polylines
	      if (polyline) map.removeLayer(polyline);
	      if (marker) map.removeLayer(marker);
	      if (heatLayer) map.removeLayer(heatLayer);
	      idleMarkers.forEach(m => map.removeLayer(m));
	      idleMarkers.length = 0;

	      index = 0;
	      movedDistance = 0;
	      lastLatLng = null;

	      const firstPoint = path[0];

	      // ✅ Create marker
	      marker = L.marker([firstPoint.latitude, firstPoint.longitude], {
	        icon: carIcon,
	        rotationAngle: 0,
	        rotationOrigin: 'center center'
	      }).addTo(map);

	      marker.on('click', () => {
	        const popupContent = `
	          <div style="min-width:220px">
	            <div class="d-flex justify-content-between align-items-center mb-2">
	              <strong>Device: ${deviceId}</strong>
	              <button class="btn-close" onclick="closePopup(event)" aria-label="Close"></button>
	            </div>
	            <div><strong>Vehicle Status:</strong> ${firstPoint.vehicleStatus || "N/A"}</div>
	            <div><strong>Timestamp:</strong> ${formatTimestamp(firstPoint.timestamp)}</div>
	            <div><strong>Latitude:</strong> ${firstPoint.latitude.toFixed(5)}</div>
	            <div><strong>Longitude:</strong> ${firstPoint.longitude.toFixed(5)}</div>
	          </div>
	        `;
	        marker.unbindPopup();
	        marker.bindPopup(popupContent).openPopup();
	      });

	      map.setView([firstPoint.latitude, firstPoint.longitude], 18);

		  const totalKm = parseFloat(calculateTotalDistance(path));
		  totalDistance = totalKm;          // ✅ Store globally
		  movedDistance = 0;                // ✅ Reset at start
		  lastLatLng = null;               // ✅ Reset for accurate playback

		  // 🟦 Show: "0.00 / total km"
		  document.getElementById("distanceDisplay").textContent = `0.00 / ${totalKm.toFixed(2)} km`;

		  // Also set the input if needed
		 


	      renderIdlePoints(path);
	      calculateTripSummary(path);

	      if (mode === "lineOnly") {
	        polyline = L.polyline(path.map(p => [p.latitude, p.longitude]), { color: "blue" }).addTo(map);
	      }

	      document.getElementById("togglePlayPause").innerHTML = "▶ Play";
	      console.log("Trip loaded successfully at " + new Date().toLocaleTimeString());

	    } catch (e) {
	      console.error("Error loading trip data: ", e);
	      Swal.fire({
	        icon: 'error',
	        text: 'Failed to load trip data.',
	        toast: true,
	        position: 'center',
	        showConfirmButton: false,
	        timer: 3000,
	        timerProgressBar: true,
	        customClass: {
	          popup: 'swal-sm-mobile'
	        }
	      });
	      document.getElementById("togglePlayPause").innerHTML = "▶ Play";
	    }

	    // ✅ Ensure these are outside the try block, but still safe
	    if (path.length) {
	      map.fitBounds(L.latLngBounds(path.map(p => [p.latitude, p.longitude])));
	      updateSpeedAndProgress(0, path[0].timestamp);
	    }
	  



		

		
	

	  }
	  const idleIcon = L.icon({
	    iconUrl: '/THINTURE_IMAGE/idlenew-Photo.png',
	    iconSize: [32, 32],
	    iconAnchor: [16, 16],
	    popupAnchor: [0, -16]
	  });

	  const parkedIcon = L.icon({
	    iconUrl: '/THINTURE_IMAGE/parkednew-Photo.png',
	    iconSize: [36, 36],
	    iconAnchor: [18, 19],
	    popupAnchor: [0, -16]
	  });


	  function renderIdlePoints(path) {
	    let currentStatus = null;
	    let startIndex = null;

	    for (let i = 0; i <= path.length; i++) {
	      const point = path[i];
	      const status = point?.vehicleStatus?.toUpperCase();

	      const isSameStatus = status === currentStatus;
	      const isTargetStatus = status === "IDLE" || status === "PARKED";

	      // Continue collecting same status
	      if (isSameStatus) continue;

	      // If we finished a valid continuous period
	      if ((currentStatus === "IDLE" || currentStatus === "PARKED") && startIndex !== null) {
	        const startPoint = path[startIndex];
	        const endPoint = path[i - 1];
	        const durationMs = new Date(endPoint.timestamp) - new Date(startPoint.timestamp);

	        if (durationMs >= 180000) {
	          const icon = currentStatus === "IDLE" ? idleIcon : parkedIcon;
	          const durationStr = msToHMS(durationMs);
	          const popupContent = `
	            <div>
	              <strong>${currentStatus} Period</strong><br/>
				  <b>Start:</b> ${formatTimestamp(startPoint.timestamp)}<br/>
				  <b>End:</b> ${formatTimestamp(endPoint.timestamp)}<br/>

	              <b>Duration:</b> ${durationStr}<br/>
	             
	            </div>
	          `;

	          const marker = L.marker([endPoint.latitude, endPoint.longitude], { icon })
	            .addTo(map)
	            .bindPopup(popupContent);

	          idleMarkers.push(marker);
	        }
	      }

	      // Start new group if valid
	      if (isTargetStatus) {
	        currentStatus = status;
	        startIndex = i;
	      } else {
	        currentStatus = null;
	        startIndex = null;
	      }
	    }
	  }
	  function msToHMS(ms) {
	    const totalSeconds = Math.floor(ms / 1000);
	    const hrs = Math.floor(totalSeconds / 3600);
	    const mins = Math.floor((totalSeconds % 3600) / 60);
	    const secs = totalSeconds % 60;
	    return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
	  }

	  function formatTimestamp(timestamp) {
	    const d = new Date(timestamp);
	    const yyyy = d.getUTCFullYear();
	    const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
	    const dd = String(d.getUTCDate()).padStart(2, '0');
	    const hh = String(d.getUTCHours()).padStart(2, '0');
	    const min = String(d.getUTCMinutes()).padStart(2, '0');
	    const sec = String(d.getUTCSeconds()).padStart(2, '0');
	    return `${yyyy}-${mm}-${dd} ${hh}:${min}:${sec} UTC`;
	  }


	  function closePopup(e) {
	    e.stopPropagation(); // prevent map click from firing
	    map.closePopup();
	  }



	  map.on('click', () => map.closePopup());

	  function pauseTrip() {
	    if (timer) clearTimeout(timer);
	  }

	  function resetTrip() {
	    pauseTrip();
	    index = 0;
	    if (marker && path.length) {
	      const p = path[0];
	      marker.setLatLng([p.latitude, p.longitude]);
	      marker.setRotationAngle(0);
	      map.panTo([p.latitude, p.longitude]);
	      updateSpeedAndProgress(0, p.timestamp);
	    }
	  }

	  function toggleHeatmap() {
	    if (!path.length) return;
	    if (heatLayer) {
	      map.removeLayer(heatLayer);
	      heatLayer = null;
	    } else {
	      const points = path.map(p => [p.latitude, p.longitude, 0.5]);
	      heatLayer = L.heatLayer(points, { radius: 20 }).addTo(map);
	    }
	  }

	  function setSpeed(value, btn = null) {
	    playbackSpeed = value;

	    // Highlight active speed button
	    const btns = document.querySelectorAll('#speedControlGroup button');
	    btns.forEach(b => b.classList.remove('active'));
	    if (btn) btn.classList.add('active');

	    if (timer) {
	      pauseTrip();
	      playTrip();
	    }
	  }


	  function stepForward() {
	    if (index < path.length - 1) {
	      index++;
	      updatePlaybackFrame();
	    }
	  }

	  function stepBackward() {
	    if (index > 0) {
	      index--;
	      updatePlaybackFrame();
	    }
	  }

	  function seekProgress(event) {
	    if (!path.length) return;
	    const bar = event.currentTarget;
	    const rect = bar.getBoundingClientRect();
	    const clickX = event.clientX - rect.left;
	    const percentage = clickX / rect.width;
	    index = Math.floor(percentage * path.length);
	    updatePlaybackFrame();
	  }
	  function updateSpeedAndProgress(speed, timestamp = null) {
	    const point = path[index];
	    const status = point.vehicleStatus || "N/A";
	    const lat = point.latitude;
	    const lng = point.longitude;

	    // 🧾 Update digital display
	    document.getElementById("speedometer").textContent =
	      `Speed: ${Math.round(speed)} km/h`
	      + `${timestamp ? " | Time: " + new Date(timestamp).toLocaleString() : ""}`
	      + ` | Status: ${status}`
	      + ` | Lat: ${lat.toFixed(5)}`
	      + ` | Lng: ${lng.toFixed(5)}`;

	    // 🧭 Update progress bar
	    document.getElementById("currentIndex").textContent = index + 1;
	    document.getElementById("totalIndex").textContent = `/ ${path.length}`;
	    document.getElementById("progressFill").style.width = `${(index / path.length) * 100}%`;

	    // 🌀 Update analog speedo
	    if (typeof speedo !== "undefined") {
	      speedo.value = Math.round(speed || 0);
	    }

	    // ✅ Create popup content
	    const popupContent = `
	      <div style="min-width:220px">
	        <div class="d-flex justify-content-between align-items-center mb-2">
	          <strong>Device: ${lastDeviceId}</strong>
	         
	        </div>
	        <div><strong>Vehicle Status:</strong> ${status}</div>
	        <div><strong>Timestamp:</strong> ${formatTimestamp(point.timestamp)}</div>
	        <div><strong>Latitude:</strong> ${lat.toFixed(5)}</div>
	        <div><strong>Longitude:</strong> ${lng.toFixed(5)}</div>
	       
	      </div>
	    `;

	    // 🧠 Update popup only if it's open
	    if (marker.isPopupOpen()) {
	      marker.setPopupContent(popupContent);  // refresh content without flicker
	    }
	  }


	  document.getElementById("polylineMode").value = "withIcons";


	  function updatePlaybackFrame() {
	    if (!path[index]) return;

	    const point = path[index];

	    // 🛻 Move marker and rotate
	    marker.setLatLng([point.latitude, point.longitude]);
	    if (point.course !== undefined) {
	      marker.setRotationAngle(point.course);
	    }

	    // 📍 Pan the map
	    map.panTo([point.latitude, point.longitude]);

	    // ✅ Recalculate moved distance from start to current index
	    movedDistance = 0;
	    for (let i = 1; i <= index; i++) {
	      movedDistance += haversineDistance(
	        path[i - 1].latitude, path[i - 1].longitude,
	        path[i].latitude, path[i].longitude
	      );
	    }

	    // 📏 Update distance display (Travelled / Total)
	    document.getElementById("distanceDisplay").textContent =
	      `${movedDistance.toFixed(2)} / ${totalDistance.toFixed(2)} km`;

	    // 📊 Update speed and progress UI
	    updateSpeedAndProgress(point.speed, point.timestamp);

	    // ✏️ Draw polyline if mode = withIcons
	    const mode = document.getElementById("polylineMode").value;
	    if (mode === "withIcons") {
	      const partialPath = path.slice(0, index + 1).map(p => [p.latitude, p.longitude]);
	      if (polyline) map.removeLayer(polyline);
	      polyline = L.polyline(partialPath, { color: "blue" }).addTo(map);
	    }
	  }



	  function getURLParam(name) {
	    const params = new URLSearchParams(window.location.search);
	    return params.get(name);
	  }

	  window.addEventListener("DOMContentLoaded", () => {
	    const urlDeviceId = getURLParam("deviceId");
	    if (urlDeviceId) {
	      document.getElementById("deviceId").value = urlDeviceId;
	    }
	  });

	  function playTrip() {
	    if (!path.length || index >= path.length) return;
	    pauseTrip(); // stop any existing timer

		function step() {
		  if (index >= path.length - 1) {
		    pauseTrip();
		    isPlaying = false;
		    const btn = document.getElementById("togglePlayPause");
		    btn.innerHTML = "▶ Play";
		    btn.classList.remove("btn-danger");
		    btn.classList.add("btn-primary");

		    // ✅ SweetAlert instead of default alert
		    Swal.fire({
		      icon: 'success',
		      title: 'Playback Completed',
		      text: 'The trip playback has finished.',
		      position: 'center',
		      showConfirmButton: false,
		      timer: 3000,
		      timerProgressBar: true,
		      customClass: {
		        popup: 'swal-sm-mobile'
		      }
		    });

		    return;
		  }

		  updatePlaybackFrame();
		  index++;
		  timer = setTimeout(step, 500 / playbackSpeed);
		}


	    step();
	  }

	  
	  

	  
	  
	  
	  
	  let isPlaying = false; // global state

	  function togglePlayPause() {
	    if (isPlaying) {
	      pauseTrip();
	      document.getElementById("togglePlayPause").innerHTML = "▶ Play";
	      document.getElementById("togglePlayPause").classList.remove("btn-danger");
	      document.getElementById("togglePlayPause").classList.add("btn-primary");
	      isPlaying = false;
	    } else {
	      playTrip();
	      document.getElementById("togglePlayPause").innerHTML = "⏸ Pause";
	      document.getElementById("togglePlayPause").classList.remove("btn-primary");
	      document.getElementById("togglePlayPause").classList.add("btn-danger");
	      isPlaying = true;
	    }
	  }

	  // Also update playTrip() to call `togglePlayPause()` when trip ends
	  function playTrip() {
	    if (!path.length || index >= path.length) return;
	    pauseTrip(); // stop any existing timer

		function step() {
		  if (index >= path.length - 1) {
		    pauseTrip();
		    isPlaying = false;
		    const btn = document.getElementById("togglePlayPause");
		    btn.innerHTML = "▶ Play";
		    btn.classList.remove("btn-danger");
		    btn.classList.add("btn-primary");

		    // ✅ SweetAlert instead of default alert
		    Swal.fire({
		      icon: 'success',
		      title: 'Playback Completed',
		      text: 'The trip playback has finished.',
		      position: 'center',
		      showConfirmButton: false,
		      timer: 3000,
		      timerProgressBar: true,
		      customClass: {
		        popup: 'swal-sm-mobile'
		      }
		    });

		    return;
		  }

		  updatePlaybackFrame();
		  index++;
		  timer = setTimeout(step, 500 / playbackSpeed);
		}


	    step();
	  }

	</script>
	<script>
		function calculateTripSummary(path) {
		  if (!path.length) return;

		  let maxSpeed = 0, totalSpeed = 0;
		  let validSpeedCount = 0;

		  const startTime = new Date(path[0].timestamp);
		  const endTime = new Date(path[path.length - 1].timestamp);
		  const durationMs = endTime - startTime;

		  path.forEach(p => {
		    const s = parseFloat(p.speed || 0);
		    if (!isNaN(s)) {
		      maxSpeed = Math.max(maxSpeed, s);
		      totalSpeed += s;
		      validSpeedCount++;
		    }
		  });

		  const avgSpeed = validSpeedCount ? (totalSpeed / validSpeedCount).toFixed(1) : 0;
		  const durationStr = new Date(durationMs).toISOString().substr(11, 8); // HH:MM:SS

		  document.getElementById("maxSpeed").textContent = Math.round(maxSpeed);
		  document.getElementById("avgSpeed").textContent = avgSpeed;
		  document.getElementById("travelTime").textContent = durationStr;
		}

		const speedo = new RadialGauge({
		  renderTo: 'realSpeedo',
		  width: 200,
		  height: 200,
		  units: "km",
		  minValue: 0,
		  maxValue: 200,
		  majorTicks: ["0", "20", "40", "60", "80", "100", "120", "140", "160", "180", "200"],
		  minorTicks: 2,
		  strokeTicks: true,
		  highlights: [
		    { from: 100, to: 150, color: "rgba(255,165,0,.75)" },
		    { from: 150, to: 200, color: "rgba(200,30,30,.75)" }
		  ],
		  colorPlate: "#fff",
		  colorMajorTicks: "#000",
		  colorMinorTicks: "#222",
		  colorTitle: "#000",
		  colorUnits: "#000",
		  colorNumbers: "#000",
		  colorNeedle: "red",
		  needleType: "arrow",
		  needleWidth: 2,
		  animationDuration: 300,
		  animationRule: "linear",
		  value: 0,
		  animatedValue: true,

		  // ✅ Add these two lines to hide .00
		  valueInt: 1,  // Only integer part
		  valueDec: 0   // No decimals
		}).draw();



	</script>
