  <script>
  const rowsPerPage = 20;
  let tripDataGlobal = [];
  let currentPage = 1;

  // Fetch Device, Driver, Vehicle dropdowns
  async function fetchDropdowns() {
    try {
      const [devices, drivers] = await Promise.all([
        fetch('/api/vehicle/report/devices').then(r => r.json()),
        fetch('/api/drivers').then(r => r.json())
      ]);

      // === Populate deviceID dropdown ===
      const deviceDropdown = document.getElementById('deviceID');
      deviceDropdown.innerHTML = '<option value="">All</option>'; // Reset options
      devices.forEach(device => {
        const id = typeof device === 'string' ? device : device.deviceID || device.id;
        if (id) {
          const opt = new Option(id, id);
          deviceDropdown.add(opt);
        }
      });

      // === Populate driverName dropdown ===
      const driverDropdown = document.getElementById('driverName');
      driverDropdown.innerHTML = '<option value="">All</option>';
      drivers.forEach(d => {
        const name = d.fullName || d;
        if (name) {
          driverDropdown.add(new Option(name, name));
        }
      });

    } catch (err) {
      console.error("🔴 fetchDropdowns error:", err);
      Swal.fire("Error", "Unable to load dropdown options.", "error");
    }
  }

    
	  
	

  // Quick Time
  function setQuickTime() {
    const v = document.getElementById('quickTime').value;
    let now = new Date();

    const formatDateTimeLocal = (date) => {
      const pad = n => n.toString().padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    };

    if (v === 'today') {
      const start = new Date(now);
      start.setHours(0, 0, 0, 0);
      const end = new Date(now);
      end.setHours(23, 59, 0, 0);
      document.getElementById('fromDate').value = formatDateTimeLocal(start);
      document.getElementById('toDate').value = formatDateTimeLocal(end);

    } else if (v === 'yesterday') {
      const start = new Date(now);
      start.setDate(start.getDate() - 1);
      start.setHours(0, 0, 0, 0);
      const end = new Date(now);
      end.setDate(end.getDate() - 1);
      end.setHours(23, 59, 0, 0);
      document.getElementById('fromDate').value = formatDateTimeLocal(start);
      document.getElementById('toDate').value = formatDateTimeLocal(end);

    } else if (v === 'lastWeek') {
      const end = new Date(now);
      end.setHours(23, 59, 0, 0);
      const start = new Date(now);
      start.setDate(start.getDate() - 7);
      start.setHours(0, 0, 0, 0);
      document.getElementById('fromDate').value = formatDateTimeLocal(start);
      document.getElementById('toDate').value = formatDateTimeLocal(end);

    } else if (v === 'thisMonth') {
      const start = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
      const end = new Date(now);
      end.setHours(23, 59, 0, 0);
      document.getElementById('fromDate').value = formatDateTimeLocal(start);
      document.getElementById('toDate').value = formatDateTimeLocal(end);
    }
  }

  // Search Trips
  async function searchTrips() {
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    const tripMode = document.getElementById('tripMode').value;

    if (!from || !to) {
      Swal.fire({icon: "warning", title: "Missing Dates", text: "Please select From and To."});
      return;
    }

    let url = `/api/vehicle/report?startDate=${from}&endDate=${to}`;
    ['deviceID','driverName'].forEach(id => {
      const v = document.getElementById(id).value;
      if (v) url += `&${id}=${v}`;
    });

    document.getElementById('tripTable').innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';

    try {
      const res = await fetch(url);
      const data = await res.json();

      // 1. First update the status counts always
      updateStatusSummary(data);

      // 2. Then calculate trip summary
	  if (data.length > 0) {
	    let trips = calculateTripsWithRest(data);

	    // 🔒 Filter trips strictly within the selected UTC From-To range
	    const fromUtc = new Date(document.getElementById('fromDate').value + 'Z');
	    const toUtc = new Date(document.getElementById('toDate').value + 'Z');

	    trips = trips.filter(t =>
	      new Date(t.startTime) >= fromUtc &&
	      new Date(t.endTime) <= toUtc
	    );

	    // Sort trips so latest comes first
	    trips.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));


		if (tripMode === 'daily') {
		  trips = summarizeTripsPerDay(trips);
		  trips.sort((a, b) => new Date(b.startTime) - new Date(a.startTime)); // latest day first
		}


        if (trips.length > 0) {
          initializePagination(trips);
        } else {
          tripDataGlobal = [];
          document.getElementById('tripTable').innerHTML = '<tr><td colspan="7" class="text-center text-warning">No complete trips detected</td></tr>';
          document.getElementById('currentPage').innerText = 'Page 0 of 0';
        }
      } else {
        tripDataGlobal = [];
        document.getElementById('tripTable').innerHTML = '<tr><td colspan="7" class="text-center text-danger">No records found</td></tr>';
        document.getElementById('currentPage').innerText = 'Page 0 of 0';
      }

    } catch (e) {
      console.error(e);
      document.getElementById('tripTable').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error fetching</td></tr>';
    }
  }

  function updateStatusSummary(data) {
    let running = 0, idle = 0, parked = 0;
    data.forEach(d => {
      const status = d.vehicleStatus?.toUpperCase() || "";
      if (status === 'RUNNING') running++;
      if (status === 'IDLE') idle++;
      if (status === 'PARKED') parked++;
    });

    document.getElementById('runningCount').innerText = running;
    document.getElementById('idleCount').innerText = idle;
    document.getElementById('parkedCount').innerText = parked;
  }

  // Trip and Rest Calculation
  // -----------------------------------------------------------------------------
  //  New rules: start-on-running(≥2s gap) • rest ≤120 s • end on rest >120 s
  // -----------------------------------------------------------------------------
  function calculateTripsWithRest(data, restThresholdSec = 120, startGapSec = 2) {
     if (!Array.isArray(data) || !data.length) return [];

     // 1. sort ascending
     data.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

     const trips = [];

     // working state
     let trip = null;            // current trip object (null = no trip)
     let lastPoint = null;       // previous processed point
     let restStart = null;       // TS where the current IDLE/PARKED streak began
     let restStartPt = null;     // full point object of that streak start

     const pushTrip = (endPt) => {
       if (!trip) return;
       trips.push({
         deviceID: trip.start.deviceID || "-",
         driverName: trip.start.driverName || "-",
         startTime: trip.start.timestamp,
         endTime: endPt.timestamp,
         startLat: trip.start.latitude,
         startLon: trip.start.longitude,
         endLat: endPt.latitude,
         endLon: endPt.longitude,
         totalRestSeconds: Math.min(trip.restSeconds,           // never > trip duration
           (new Date(endPt.timestamp) - new Date(trip.start.timestamp)) / 1000)
       });
       // reset state
       trip = null;
       restStart = null;
       restStartPt = null;
     };

     // ---------------------------------------------------------------------------
     for (const pt of data) {
       // guard: skip bad rows
       if (!pt || !pt.timestamp) continue;

       const ts        = new Date(pt.timestamp);
       const status    = (pt.vehicleStatus || "").toUpperCase();

       // ─────────────────────────────────────────────────────────────────────────
       // 1) RUNNING
       // ─────────────────────────────────────────────────────────────────────────
       if (status === "RUNNING") {
         // If we’re coming out of a rest streak, decide whether it broke the trip
         if (restStart) {
           const restDur = (ts - restStart) / 1000;
           if (restDur > restThresholdSec) {
             // Streak is longer than threshold ⇒ end previous trip
             pushTrip(restStartPt);      // trip ends at first point of the long rest
           } else if (trip) {
             // otherwise add rest time to the open trip
             trip.restSeconds += restDur;
           }
           // Either way, streak ends now
           restStart = null;
           restStartPt = null;
         }

         // Either we just started a new trip or we’re already in one
         if (!trip) {
           // Only open a trip if this RUNNING point is ≥ startGapSec after last msg
           if (!lastPoint || (ts - new Date(lastPoint.timestamp)) / 1000 >= startGapSec) {
             trip = { start: pt, restSeconds: 0 };
           }
         }
       }

       // ─────────────────────────────────────────────────────────────────────────
       // 2) IDLE/PARKED
       // ─────────────────────────────────────────────────────────────────────────
       if (status === "IDLE" || status === "PARKED") {
         // mark the beginning of a potential rest streak
         if (!restStart) {
           restStart   = ts;
           restStartPt = pt;
         }
         // If we are NOT in a trip, we simply ignore long parked/idles (leading tail)
         // If we ARE in a trip, we will know later (when we get RUNNING again) whether
         // the streak stayed within restThreshold or actually broke the trip.
       }

       // keep the very last processed point
       lastPoint = pt;
     }

     // ---------------------------------------------------------------------------
     // Clean-up after loop: if a trip is still open we need to decide where it ends
     // ---------------------------------------------------------------------------
     if (trip) {
       if (restStart && ((new Date(lastPoint.timestamp) - restStart) / 1000) > restThresholdSec) {
         // final streak broke the trip
         pushTrip(restStartPt);
       } else {
         // final streak (if any) was just a rest ≤120 s – include it
         if (restStart) trip.restSeconds += (new Date(lastPoint.timestamp) - restStart) / 1000;
         pushTrip(lastPoint);
       }
     }

     return trips;
   }







  function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);

            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }



  function initializePagination(trips) {
    const selectedDeviceID = document.getElementById('deviceID').value;
    if (selectedDeviceID) {
      trips = trips.filter(t => t.deviceID === selectedDeviceID);
    }
    tripDataGlobal = trips;
    currentPage = 1;

    // Update Total Trip Count and Night Trip Count
    document.getElementById('totalTripCount').innerText = tripDataGlobal.length;

    const nightTrips = tripDataGlobal.filter(t => isNightDrive(t.startTime, t.endTime));
    document.getElementById('nightTripCount').innerText = nightTrips.length;

    renderPage();
  }


  function summarizeTripsPerDay(trips) {
    const grouped = {};

    trips.forEach(t => {
      const day = new Date(t.startTime).toISOString().split("T")[0];
      const key = `${t.deviceID}_${day}`;

      if (!grouped[key]) {
        grouped[key] = {
          deviceID: t.deviceID,
          driverName: t.driverName,
          startTime: t.startTime,
          endTime: t.endTime,
          totalRestSeconds: t.totalRestSeconds,
          tripCount: 1,
          totalKm: t.totalKm || 0    // 🆕 Add total KM here if you're already calculating
        };
      } else {
        grouped[key].startTime = new Date(t.startTime) < new Date(grouped[key].startTime) ? t.startTime : grouped[key].startTime;
        grouped[key].endTime = new Date(t.endTime) > new Date(grouped[key].endTime) ? t.endTime : grouped[key].endTime;
        grouped[key].totalRestSeconds += t.totalRestSeconds;
        grouped[key].tripCount++;
        grouped[key].totalKm += t.totalKm || 0;   // 🆕 Accumulate KM
      }
    });

    return Object.values(grouped);
  }

  function formatLocalTime(timestamp) {
    if (!timestamp) return '–';
    const dateObj = new Date(timestamp);
    return dateObj.toISOString().replace("T", " ").substring(0, 19);
  }


  function renderPage() {
    const start = (currentPage - 1) * rowsPerPage;
    const pageData = tripDataGlobal.slice(start, start + rowsPerPage);
    const tbl = document.getElementById('tripTable');
    tbl.innerHTML = '';
    document.getElementById('totalKmValue').innerText = 'Calculating...';

    if (!pageData.length) {
      tbl.innerHTML = '<tr><td colspan="10" class="text-center text-warning">No records</td></tr>';
      document.getElementById('totalKmValue').innerText = '0.00';
      return;
    }

    const promises = [];

	pageData.forEach(r => {
	  const driveType = isNightDrive(r.startTime, r.endTime); // Call only once
	  let nightBadge = '';
	  let nightRowClass = 'table-light';

	  if (driveType === "Night") {
	    nightBadge = '<span class="badge bg-dark"><i class="fas fa-moon"></i> Night Drive</span>';
	  } else if (driveType === "Day") {
	    nightBadge = '<span class="badge bg-warning text-dark"><i class="fas fa-sun"></i> Day Drive</span>';
	  } else if (driveType === "Both") {
	    nightBadge = '<span class="badge bg-info text-white"><i class="fas fa-adjust"></i> Day & Night</span>';
	  }

	  const rowId = `${r.startTime}_${r.endTime}`.replace(/[^a-zA-Z0-9]/g, '_');

	  tbl.innerHTML += `
	    <tr class="${nightRowClass}" id="tripRow_${rowId}">
	      <td>${r.deviceID}</td>
	      <td>${r.driverName}</td>
		  <td>${formatLocalTime(r.startTime)}</td>
		      <td>${formatLocalTime(r.endTime)}</td>
	      <td>${formatDuration(new Date(r.endTime) - new Date(r.startTime))}</td>
	      <td>${formatDuration(r.totalRestSeconds * 1000)}</td>
	      <td id="tripKm_${rowId}">Calculating...</td>
	      <td>${nightBadge}</td>
		  
	      <td><button class="btn btn-sm btn-outline-primary" onclick='viewTripPath(${JSON.stringify(r)})'><i class="fas fa-map-marker-alt"></i> View Trip</button></td>
	      <td><button class="btn btn-sm btn-outline-success" onclick='showSpeedGraph(${JSON.stringify(r)})'><i class="fas fa-chart-line"></i> Speed Graph</button></td>
	    </tr>`;


      // Push distance calculation promises
      promises.push(
        calculateAccurateTripKm(r, rowId).then(distance => ({ rowId, distance }))
      );
    });

    // Wait for all KM values to finish before calculating total
    Promise.all(promises).then(results => {
      let total = 0;
      results.forEach(({ rowId, distance }) => {
        total += distance;
        const cell = document.getElementById(`tripKm_${rowId}`);
        if (cell && !cell.textContent.includes('km')) {
          cell.textContent = `${distance.toFixed(2)} km`;
        }
      });

      document.getElementById('totalKmValue').innerText = total.toFixed(2);
    });

    // Pagination
    const totalPages = Math.ceil(tripDataGlobal.length / rowsPerPage) || 1;
    document.getElementById('currentPage').innerText = `Page ${currentPage} of ${totalPages}`;
  }



  function calculateTripKm(startLat, startLon, endLat, endLon) {
    if (startLat == null || startLon == null || endLat == null || endLon == null) return 0;
    return calculateDistance(startLat, startLon, endLat, endLon).toFixed(2);
  }

  function calculateTotalTripDistance(pathPoints) {
    let totalKm = 0;
    for (let i = 1; i < pathPoints.length; i++) {
      const prev = pathPoints[i - 1];
      const curr = pathPoints[i];
      if (prev && curr && prev.latitude && prev.longitude && curr.latitude && curr.longitude) {
        totalKm += calculateDistance(prev.latitude, prev.longitude, curr.latitude, curr.longitude);
      }
    }
    return totalKm.toFixed(2);
  }


	// Total trip distance from replay points
	function calculateTotalTripDistance(pathPoints) {
	    let totalKm = 0;
	    for (let i = 1; i < pathPoints.length; i++) {
	        const prev = pathPoints[i - 1];
	        const curr = pathPoints[i];
	        if (prev && curr && prev.latitude && prev.longitude && curr.latitude && curr.longitude) {
	            totalKm += calculateDistance(prev.latitude, prev.longitude, curr.latitude, curr.longitude);
	        }
	    }
	    return totalKm.toFixed(2);
	}

	async function calculateAccurateTripKm(trip, rowId) {
	  const format = (d) => {
	    const pad = n => n.toString().padStart(2, '0');
	    const date = new Date(d);
	    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
	  };

	  const from = encodeURIComponent(format(trip.startTime));
	  const to = encodeURIComponent(format(trip.endTime));
	  const url = `/api/vehicle/history/${trip.deviceID}?from=${from}&to=${to}`;
	  const cell = document.getElementById(`tripKm_${rowId}`);

	  try {
	    const res = await fetch(url);
	    const replayData = await res.json();

	    let distanceKm = 0;
	    if (Array.isArray(replayData) && replayData.length >= 2) {
	      distanceKm = calculateTotalTripDistance(replayData);
	      if (cell) cell.textContent = `${distanceKm} km`;
	    } else if (trip.startLat && trip.startLon && trip.endLat && trip.endLon) {
	      distanceKm = calculateTripKm(trip.startLat, trip.startLon, trip.endLat, trip.endLon);
	      if (cell) cell.innerHTML = `${distanceKm} km <small class="text-warning">(est)</small>`;
	    } else {
	      if (cell) cell.textContent = "0.00 km";
	    }

	    return parseFloat(distanceKm);
	  } catch (e) {
	    console.error("⚠️ Error calculating trip KM:", e);
	    if (cell) cell.textContent = "Error";
	    return 0;
	  }
	}




	function updateTotalKm() {
	    let total = 0;
	    const cells = document.querySelectorAll('[id^="tripKm_"]');
	    cells.forEach(cell => {
	        const text = cell.textContent || '';
	        const match = text.match(/([\d.]+)\s*km/);
	        if (match) {
	            total += parseFloat(match[1]);
	        }
	    });
	    document.getElementById('totalKmValue').innerText = total.toFixed(2);
	}





  
	function isNightDrive(startTime, endTime) {
	  const start = new Date(startTime);
	  const end = new Date(endTime);
	  const totalMinutes = (end - start) / (1000 * 60);
	  if (totalMinutes <= 0) return "Day";

	  let nightMinutes = 0;
	  let current = new Date(start);

	  while (current < end) {
	    const hour = current.getHours();
	    const isNight = (hour < 6 || hour >= 20); // 8 PM - 6 AM is night
	    if (isNight) nightMinutes++;
	    current.setMinutes(current.getMinutes() + 1);
	  }

	  const nightPercentage = (nightMinutes / totalMinutes) * 100;

	  if (nightPercentage >= 70) return "Night";
	  else if (nightPercentage <= 30) return "Day";
	  else return "Both";
	}




  function changePage(dir) {
    const total = Math.ceil(tripDataGlobal.length/rowsPerPage)||1;
    if (currentPage+dir<1 || currentPage+dir>total) return;
    currentPage += dir;
    renderPage();
  }

  function formatDuration(ms) {
    let seconds = Math.floor(ms/1000);
    let h = Math.floor(seconds/3600);
    let m = Math.floor((seconds%3600)/60);
    let s = seconds%60;
    return `${h}h ${m}m ${s}s`;
  }

  let speedChart;

  async function showSpeedGraph(trip) {
      try {
          // Format ISO string to "yyyy-MM-dd HH:mm:ss" in UTC
          const formatUtcTime = (iso) => {
              const d = new Date(iso);
              const pad = n => n.toString().padStart(2, '0');
              return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ` +
                     `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
          };

          const deviceID = encodeURIComponent(trip.deviceID);
          const from = encodeURIComponent(formatUtcTime(trip.startTime));
          const to = encodeURIComponent(formatUtcTime(trip.endTime));

          const url = `/api/vehicle/history/${deviceID}?from=${from}&to=${to}`;
          const res = await fetch(url);
          const replayData = await res.json();

          if (!replayData || replayData.length === 0) {
              Swal.fire("No Data", "No speed data available for this trip.", "warning");
              return;
          }

          // 🕒 Use UTC time for chart labels
          const labels = replayData.map(p => {
              const d = new Date(p.timestamp);
              const pad = n => n.toString().padStart(2, '0');
              return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
          });

          const speeds = replayData.map(p => parseFloat(p.speed) || 0);

          if (speedChart) speedChart.destroy();

          const ctx = document.getElementById("speedChartCanvas").getContext("2d");

          const gradient = ctx.createLinearGradient(0, 0, 0, 300);
          gradient.addColorStop(0, 'rgba(0, 153, 255, 0.5)');
          gradient.addColorStop(1, 'rgba(0, 153, 255, 0.05)');

          speedChart = new Chart(ctx, {
              type: 'line',
              data: {
                  labels,
                  datasets: [{
                      label: 'Speed (km/h)',
                      data: speeds,
                      borderColor: '#007bff',
                      backgroundColor: gradient,
                      tension: 0.3,
                      fill: true,
                      pointRadius: 2,
                      pointHoverRadius: 4,
                      pointBackgroundColor: '#007bff'
                  }]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  layout: { padding: 10 },
                  scales: {
                      y: {
                          min: 0,
                          max: 200,
                          ticks: {
                              stepSize: 5,
                              autoSkip: false,
                              callback: value => {
                                  const allowed = [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200];
                                  return allowed.includes(value) ? value + ' km/h' : '';
                              },
                              color: '#333',
                              font: { size: 13, weight: 'bold' }
                          },
                          grid: {
                              color: 'rgba(0, 0, 0, 0.08)',
                              drawTicks: true
                          }
                      },
                      x: {
                          ticks: { display: false },
                          grid: { display: false }
                      }
                  },
                  plugins: {
                      legend: {
                          labels: {
                              font: { size: 14, weight: 'bold' },
                              color: '#007bff'
                          }
                      },
                      tooltip: {
                          backgroundColor: '#222',
                          titleColor: '#fff',
                          bodyColor: '#fff',
                          borderColor: '#007bff',
                          borderWidth: 1,
                          padding: 10
                      }
                  }
              }
          });

          new bootstrap.Modal(document.getElementById("speedChartModal")).show();

      } catch (error) {
          console.error("Speed graph error:", error);
          Swal.fire("Error", "Unable to load speed data.", "error");
      }
  }

  function downloadExcel() {
      const wb = XLSX.utils.book_new();
      const wsData = [
          ["Vehicle Number", "Driver Name", "Trip Start", "Trip End", "Duration", "Rest Time", "Distance (KM)", "Day/Night"]
      ];

      tripDataGlobal.forEach(t => {
          const duration = formatDuration(new Date(t.endTime) - new Date(t.startTime));
          const restTime = formatDuration(t.totalRestSeconds * 1000);
          const rowId = `${t.startTime}_${t.endTime}`.replace(/[^a-zA-Z0-9]/g, '_');
          const distanceText = document.getElementById(`tripKm_${rowId}`)?.textContent || "0.00 km";
          const driveType = isNightDrive(t.startTime, t.endTime);

          wsData.push([
              t.deviceID, t.driverName,
              new Date(t.startTime).toLocaleString(),
              new Date(t.endTime).toLocaleString(),
              duration,
              restTime,
              distanceText,
              driveType
          ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, "Trips");
      XLSX.writeFile(wb, "Trip_Report.xlsx");
  }
  </script>
