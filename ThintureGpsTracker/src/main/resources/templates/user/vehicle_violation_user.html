<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thinture GPS</title>
    <link rel="icon" type="image/x-icon" href="/THINTURE_IMAGE/favicon.jpg">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
	<!-- ✅ ORDER MATTERS -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>


	<!-- Leaflet CSS & JS (if not already included) -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}">
	
	<link rel="stylesheet" type="text/css" th:href="@{/css/vviolation.css}">
    <style>
       .modal{
		color:black;
	   }
	   @media (max-width: 576px) {
	     #violationMap {
	       height: 300px;
	     }
	   }

	   @media (min-width: 577px) {
	     #violationMap {
	       height: 400px;
	     }
	   }
	   #deviceList {
	     z-index: 9999;
	     display: none;
	     width:90% !important;
	     max-height: 220px;
	     overflow-y: auto;
	     background-color: white;
	     border: 1px solid #ced4da;
	     border-top: none;
	     border-radius: 0 0 0.375rem 0.375rem;
	     box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
	     padding: 0;
	     margin-top: -1px;
	   }

	   #deviceList li {
	     list-style: none;
	     padding: 8px 12px;
	     cursor: pointer;
	     font-size: 14px;
	   }

	   #deviceList li:hover,
	   #deviceList li.active {
	     background-color: #0d6efd;
	     color: white;
	     border-radius: 0;
	   }

	   #deviceID:focus {
	     outline: none;
	     box-shadow: none;
	     border-color: #86b7fe;
	   }

	   input#deviceID::selection {
	     background: transparent;
	   }
	   #pagination-controls {
	     background: transparent;
	   }

	   .pagination-style {
	     background-color: #0d1b3d;
	     color: white;
	     border: none;
	     padding: 8px 20px;
	     border-radius: 10px;
	     font-weight: 600;
	     box-shadow: 0 0 10px rgba(173, 216, 230, 0.3); /* light blue glow */
	     transition: 0.3s ease;
	   }

	   .pagination-style:hover {
	     background-color: #122855;
	     transform: scale(1.03);
	   }

	   .page-info {
	     font-size: 1rem;
	   }

	  


    </style>
</head>
<body>

<header th:replace="navigation_user :: navbar_user"></header>

<div class="card">
    <h1 class="text-center mb-4">Vehicle Violation Report</h1>

    <!-- Filters -->
    <div class="filters row g-3 mb-4">
        <div class="col-md-3">
            <label for="quickTime" class="form-label">Quick Time:</label>
            <select id="quickTime" class="form-select" onchange="setQuickTime()">
                <option value="">Select</option>
                <option value="today">Today</option>
                <option value="lastWeek">Last Week</option>
            </select>
        </div>
        <div class="col-md-3">
            <label for="fromDate" class="form-label">From Date:</label>
            <input type="date" id="fromDate" class="form-control">
        </div>
        <div class="col-md-3">
            <label for="fromTime" class="form-label">From Time:</label>
            <input type="time" id="fromTime" class="form-control" value="00:00">
        </div>
        <div class="col-md-3">
            <label for="toDate" class="form-label">To Date:</label>
            <input type="date" id="toDate" class="form-control">
        </div>
        <div class="col-md-3">
            <label for="toTime" class="form-label">To Time:</label>
            <input type="time" id="toTime" class="form-control" value="23:59">
        </div>
		<div class="col-md-3 position-relative">
		  <label for="deviceID" class="form-label">Vehicle Number:</label>
		  <input
		    type="text"
		    id="deviceID"
		    class="form-control"
		    autocomplete="off"
		    inputmode="text"
		    name="device-id-input"
		    placeholder="Type device ID..."
		    oninput="filterDeviceList()"
		    onfocus="showDeviceList()"
		    onblur="hideDeviceListWithDelay()"
		    aria-autocomplete="none"
		    spellcheck="false"
		  />

		  <ul id="deviceList" class="list-group position-absolute w-100"></ul>
		</div>





        <div class="col-md-3">
            <label for="additionalData" class="form-label">Violation Type:</label>
            <select id="additionalData" class="form-select"></select>
        </div>
		<div class="col-md-2 d-grid">
		      <label class="invisible">Search</label>
		      <button class="searchb" onclick="searchReports()">Search</button>
		    </div>

        <div class="col-md-3 d-grid">
            <button class="download" onclick="downloadPDF()">Download PDF</button>
        </div>
        <div class="col-md-3 d-grid">
            <button class="download" onclick="downloadExcel()">Download Excel</button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container mb-3">
        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr>
                       
                        <th>Violation Type</th>
                        <th>Latitude</th>
                        <th>Longitude</th>
                        <th>Speed</th>
                        <th>Time</th>
                        <th>Driver Name</th>
						<th>Location</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                    <tr>
                        <td colspan="8" class="text-center text-danger fw-bold">No data available</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
	<div id="pagination-controls" class="d-flex justify-content-center align-items-center mt-4 gap-3">
	  <button id="prevBtn" class="pagination-style">
	    <i class="fas fa-arrow-left text-info me-1"></i> <strong>Prev</strong>
	  </button>
	  
	  <span class="page-info text-white fw-semibold" id="page-info">Page 1 of 1</span>
	  
	  <button id="nextBtn" class="pagination-style">
	    <strong>Next</strong> <i class="fas fa-arrow-right text-info ms-1"></i>
	  </button>
	</div>


</div>
<!-- Modal for Map Location -->
<div class="modal fade" id="mapModal" tabindex="-1" aria-labelledby="mapModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="mapModalLabel">Violation Location</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="violationMap" style="height: 400px;"></div>
		<!--
        <p class="mt-3"><strong>Address:</strong> <span id="addressResult">Loading...</span></p>
        <p><strong>Vehicle Number:</strong> <span id="modalDeviceId"></span></p>
        <p><strong>Violation:</strong> <span id="modalViolation"></span></p>
		<p><strong>Timestamp:</strong> <span id="modalTimestamp">--</span></p>
		-->
      </div>
    </div>
  </div>
</div>

	

<script>
    let allData = [];
    let currentPage = 1;
    const rowsPerPage = 15;

	document.addEventListener("DOMContentLoaded", () => {
	    loadDropdown('/vehicle/violation/report/additional-data', 'additionalData', 'Select Violation');
	    loadDropdown('/vehicle/violation/report/devices', 'deviceID', 'Select Device ID');
	});

	let allDeviceIds = [];

	async function loadDropdown(url, elementId, defaultText) {
	  if (elementId === 'deviceID') {
	    const response = await fetch(url);
	    allDeviceIds = await response.json();
	  } else {
	    const dropdown = document.getElementById(elementId);
	    const response = await fetch(url);
	    const data = await response.json();
	    dropdown.innerHTML = `<option value="">${defaultText}</option>`;
	    data.forEach(item => {
	      dropdown.innerHTML += `<option value="${item}">${item}</option>`;
	    });
	  }
	}

	function filterDeviceList() {
	  const input = document.getElementById('deviceID');
	  const filter = input.value.toLowerCase();
	  const list = document.getElementById('deviceList');

	  list.innerHTML = '';

	  if (!filter) {
	    list.style.display = 'none';
	    return;
	  }

	  const filtered = allDeviceIds
	    .filter(id => id.toLowerCase().includes(filter))
	    .slice(0, 10); // Show only top 10

	  if (filtered.length === 0) {
	    list.style.display = 'none';
	    return;
	  }

	  filtered.forEach(deviceId => {
	    const li = document.createElement('li');
	    li.textContent = deviceId;
	    li.addEventListener('mousedown', e => {
	      e.preventDefault(); // Prevent selection or focus jump
	      input.value = deviceId;
	      list.style.display = 'none';

	      // Move cursor to end of input
	      input.setSelectionRange(input.value.length, input.value.length);
	    });
	    list.appendChild(li);
	  });

	  list.style.display = 'block';
	}

	function showDeviceList() {
	  filterDeviceList();
	}

	function hideDeviceListWithDelay() {
	  setTimeout(() => {
	    document.getElementById('deviceList').style.display = 'none';
	  }, 150);
	}


	function formatTimestamp(ts) {
	  if (!ts) return '--';
	  const date = new Date(ts); // Parse as ISO (assumed to be UTC)
	  const yyyy = date.getUTCFullYear();
	  const mm = String(date.getUTCMonth() + 1).padStart(2, '0');
	  const dd = String(date.getUTCDate()).padStart(2, '0');
	  const hh = String(date.getUTCHours()).padStart(2, '0');
	  const mi = String(date.getUTCMinutes()).padStart(2, '0');
	  const ss = String(date.getUTCSeconds()).padStart(2, '0');
	  return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss} `;
	}





	function toUtcIso(dateStr, timeStr) {
	    if (!dateStr || !timeStr) return '';
	    const localDate = new Date(`${dateStr}T${timeStr}`);
	    return localDate.toISOString(); // UTC format
	}

	async function searchReports() {
	    const fromUtc = toUtcIso(
	        document.getElementById("fromDate").value,
	        document.getElementById("fromTime").value
	    );
	    const toUtc = toUtcIso(
	        document.getElementById("toDate").value,
	        document.getElementById("toTime").value
	    );

	    const params = new URLSearchParams({
	        deviceId: document.getElementById("deviceID").value,
	        additionalData: document.getElementById("additionalData").value,
	        fromUtc,
	        toUtc
	    });

	    document.getElementById("reportTable").innerHTML =
	        "<tr><td colspan='8' class='text-center'>Loading...</td></tr>";

	    try {
	        const response = await fetch(`/vehicle/violation/report/violations/filter?${params}`);
	        allData = await response.json();
	        currentPage = 1;
	        renderTable();
	    } catch (e) {
	        document.getElementById("reportTable").innerHTML =
	            "<tr><td colspan='8' class='text-center'>Failed to load data</td></tr>";
	    }
	}

    function renderTable() {
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = allData.slice(start, end);

        const table = document.getElementById("reportTable");
        if (pageData.length === 0) {
            table.innerHTML = "<tr><td colspan='8' class='text-center text-danger'>No data found</td></tr>";
            document.getElementById("pagination-controls").innerHTML = '';
            return;
        }

        table.innerHTML = pageData.map(v => `
            <tr>
               
              
                <td>${v.additionalData}</td>
                <td>${v.latitude}</td>
                <td>${v.longitude}</td>
                <td>${v.speed}</td>
				<td>${formatTimestamp(v.timestamp)}</td>

                <td>${v.ownerName}</td>
				<td>
					<button class="btn btn-sm btn-link text-primary" onclick="openMapModal(${v.latitude}, ${v.longitude}, '${v.deviceId}', '${v.additionalData}', '${v.timestamp}')">
					  View
					</button>

				</td>
            </tr>
        `).join('');

        renderPagination();
    }

	function renderPagination() {
	    const totalPages = Math.ceil(allData.length / rowsPerPage) || 1;
	    document.getElementById("prevBtn").disabled = currentPage === 1;
	    document.getElementById("nextBtn").disabled = currentPage === totalPages;
	    document.getElementById("page-info").textContent = `Page ${currentPage} of ${totalPages}`;
	}


	document.getElementById("prevBtn").addEventListener("click", () => {
	    if (currentPage > 1) {
	        currentPage--;
	        renderTable();
	    }
	});

	document.getElementById("nextBtn").addEventListener("click", () => {
	    const totalPages = Math.ceil(allData.length / rowsPerPage);
	    if (currentPage < totalPages) {
	        currentPage++;
	        renderTable();
	    }
	});

    function setQuickTime() {
        const quickTime = document.getElementById("quickTime").value;
        const today = new Date();
        const todayStr = today.toISOString().split("T")[0];

        if (quickTime === "today") {
            document.getElementById("fromDate").value = todayStr;
            document.getElementById("toDate").value = todayStr;
        } else if (quickTime === "lastWeek") {
            const lastWeek = new Date(today);
            lastWeek.setDate(today.getDate() - 7);
            const lastWeekStr = lastWeek.toISOString().split("T")[0];
            document.getElementById("fromDate").value = lastWeekStr;
            document.getElementById("toDate").value = todayStr;
        } else {
            document.getElementById("fromDate").value = "";
            document.getElementById("toDate").value = "";
        }
    }

    function downloadExcel() {
        const table = document.querySelector(".table");
        const wb = XLSX.utils.table_to_book(table, {sheet: "Report"});
        XLSX.writeFile(wb, "Vehicle_Violation_Report.xlsx");
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Vehicle Violation Report", 14, 10);

		
		
		
		
		
		
		
		
		
        const table = document.querySelector(".table");
        const rows = [], headers = [];

        table.querySelectorAll("thead tr th").forEach(th => headers.push(th.innerText));
        table.querySelectorAll("tbody tr").forEach(tr => {
            const row = [];
            tr.querySelectorAll("td").forEach(td => row.push(td.innerText));
            rows.push(row);
        });

        doc.autoTable({
            head: [headers],
            body: rows,
            startY: 20,
            styles: { fontSize: 9 }
        });

        doc.save("Vehicle_Violation_Report.pdf");
    }
	
	
	


	let map, marker;

	function openMapModal(lat, lng, deviceId, violationType, timestamp) {
	  // Show modal
	  const modal = new bootstrap.Modal(document.getElementById('mapModal'));
	  modal.show();

	  setTimeout(() => {
	    if (!map) {
	      map = L.map('violationMap').setView([lat, lng], 15);
	      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	        maxZoom: 19,
	      }).addTo(map);
	    }

	    if (marker) map.removeLayer(marker);

	    // Fetch address and create popup
	    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
	      .then(res => res.json())
	      .then(data => {
	        const address = data.display_name || 'Address not found';

	        marker = L.marker([lat, lng])
	          .addTo(map)
	          .bindPopup(`
	            <div style="font-size: 13px;">
	              <b>📍 Device:</b> ${deviceId}<br>
	              <b>⚠️ Violation:</b> ${violationType}<br>
	              <b>🧭 Address:</b> ${address}<br>
				  <b>⏱️ Time:</b> ${formatTimestamp(timestamp)}

	            </div>
	          `)
	          .openPopup();

	        map.setView([lat, lng], 15);
	      })
	      .catch(() => {
	        marker = L.marker([lat, lng])
	          .addTo(map)
	          .bindPopup(`
	            <div style="font-size: 13px;">
	              <b>📍 Device:</b> ${deviceId}<br>
	              <b>⚠️ Violation:</b> ${violationType}<br>
	              <b>🧭 Address:</b> Not available<br>
				  <b>⏱️ Time:</b> ${formatTimestamp(timestamp)}

	            </div>
	          `)
	          .openPopup();

	        map.setView([lat, lng], 15);
	      });
	  }, 300);
	


	  // Reverse geocode
	  fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
	    .then(res => res.json())
	    .then(data => {
	      document.getElementById('addressResult').innerText = data.display_name || 'Address not found';
	    })
	    .catch(() => {
	      document.getElementById('addressResult').innerText = 'Error fetching address';
	    });
	}

</script>
</body>
</html>
