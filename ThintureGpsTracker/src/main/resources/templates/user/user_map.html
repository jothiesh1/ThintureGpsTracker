<!-- JS Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://rawgit.com/bbecquet/Leaflet.RotatedMarker/master/leaflet.rotatedMarker.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
	
	
	
	
	document.addEventListener("DOMContentLoaded", () => {
	  let isInitialLoad = true;

	  const map = L.map('map', {
	    center: [13.07800, 77.55933],
	    zoom: 5,
	    zoomControl: false,
	    dragging: true,
	    touchZoom: true,
	    tap: true,
	  });

	  L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png').addTo(map);


	  const clusterGroup = L.markerClusterGroup({
	    iconCreateFunction: cluster => L.divIcon({
	      html: `<div class="custom-cluster">${cluster.getChildCount()}</div>`,
	      className: 'custom-cluster',
	      iconSize: [40, 40]
	    }),
	    spiderfyOnMaxZoom: true,
	    showCoverageOnHover: false,
	    zoomToBoundsOnClick: true,
	    disableClusteringAtZoom: 14,
	    animate: true,
	    animateAddingMarkers: true,
	    maxClusterRadius: 60
	  });

	  map.addLayer(clusterGroup);

	  // Optional: make map & clusterGroup available globally
	  window.map = map;
	  window.clusterGroup = clusterGroup;
	});
	

  const stompRole = 'superadmin';
  const stompId = 1;

  const vehicleMarkers = new Map();
  const vehiclePositions = new Map();
  const lastSocketUpdate = new Map();

  


  const vehicleIconCache = new Map();


  function getVehicleIcon(course, status, vehicleType = "", model = "") {
    const rotationDeg = Math.round(course || 0); // rounded to avoid jitter
    const type = (vehicleType || "").toUpperCase();
    const color = status === 'RUNNING' ? 'green'
                : (status === 'IDLE' || status === 'PARKED') ? 'orange'
                : 'red';

    let baseName = "car0", folder = "car", width = 45, height = 50;

    switch (type) {
      case "BIKE": case "TWO_WHEELER":
        baseName = "bike0"; folder = "Bike"; width = 60; height = 60; break;
      case "TRUCK": case "LORRY":
        baseName = "truck0"; folder = "truck"; width = 40; height = 50; break;
      case "BUS":
        baseName = "bus0"; folder = "Bus"; width = 50; height = 75; break;
      case "AUTO": case "THREE_WHEELER":
        baseName = "auto0"; folder = "Auto"; width = 40; height = 60; break;
      case "TRACTOR":
        baseName = "tractor0"; folder = "Tractor"; width = 45; height = 65; break;
      case "SCOOTER":
        baseName = "scooter0"; folder = "Scooter"; width = 30; height = 55; break;
      case "AMBULANCE":
        baseName = "ambulance0"; folder = "Ambulance"; width = 48; height = 70; break;
      case "CAR": default:
        baseName = "car0"; folder = "car"; width = 45; height = 50;
    }

    const iconUrl = `/THINTURE_IMAGE/${folder}/${color}/${baseName}.png`;

    // ✅ Pixel-perfect anchor based on type
    let anchorY;
    switch (type) {
      case "BIKE": case "TWO_WHEELER": case "SCOOTER":
        anchorY = height * 0.85; break;
      case "AUTO": case "TRACTOR":
        anchorY = height * 0.80; break;
      case "BUS": case "AMBULANCE":
        anchorY = height * 0.78; break;
      case "TRUCK": case "LORRY":
        anchorY = height * 0.75; break;
      default:
        anchorY = height / 2;
    }

    // ✅ Unique cache key
    const key = `${type}_${model}_${color}_${rotationDeg}`;

    // ✅ Use cached icon if available
    if (vehicleIconCache.has(key)) {
      return vehicleIconCache.get(key);
    }

    // ✅ Create new icon and cache it
    const icon = L.divIcon({
      html: `<img src="${iconUrl}" style="transform: rotate(${rotationDeg}deg); transform-origin: center center; width:${width}px; height:${height}px;">`,
      className: 'leaflet-rotated-icon',
      iconSize: [width, height],
      iconAnchor: [width / 2, anchorY],
      popupAnchor: [0, -20],
      iconUrl: iconUrl,
      rotationDeg: rotationDeg
    });

    vehicleIconCache.set(key, icon);
    return icon;
  }



  function getGsmLabel(gsm) {
    gsm = parseInt(gsm);
    if (gsm >= 70) return "High";
    if (gsm >= 30) return "Medium";
    return "Low";
  }

  function getGsmColor(gsm) {
    gsm = parseInt(gsm);
    if (gsm >= 70) return "#28a745"; // Green
    if (gsm >= 30) return "#ffc107"; // Orange
    return "#dc3545"; // Red
  }
  function formatTime(ts) {
    // If the timestamp is invalid, return 'Unknown'
    if (!ts || isNaN(ts)) return "Unknown";

    // Create a new Date object using the timestamp
    const date = new Date(ts);

    // Format the date to 'YYYY-MM-DD HH:MM:SS UTC' format in UTC
    return date.toISOString().replace("T", " ").substring(0, 19) + " ";
  }

  const vehicleTypeCache = new Map(); // ✅ Don't forget this line at top


  function createOrUpdateMarker(vehicle) {
    const deviceId = (vehicle.deviceId || vehicle.deviceID || "").toUpperCase();
    const lat = parseFloat(vehicle.latitude);
    const lng = parseFloat(vehicle.longitude);
    const latlng = [lat, lng];
    const course = parseFloat(vehicle.course || 0);
    const speed = vehicle.speed || "0";
    const gsm = vehicle.gsmStrength || "--";
    const ignStatus = (vehicle.ignition || "").toString().trim().toUpperCase();

    const isIgnitionOn = ignStatus === "IGON";
    const ignitionDisplay = isIgnitionOn ? "ON" : "OFF";
    const ignitionColor = isIgnitionOn ? "#28a745" : "#dc3545";

    const recordTs = new Date(vehicle.timestamp).getTime();
    const socketTs = lastSocketUpdate.get(deviceId);
    let effectiveTimestamp = recordTs;

    if (typeof socketTs === "number" && !isNaN(socketTs) && socketTs > recordTs) {
      effectiveTimestamp = socketTs;
    }

    if (!effectiveTimestamp || isNaN(effectiveTimestamp)) {

	// Marker updater with full jitter suppression
	function applyOrUpdateMarker(deviceId, latlng, icon, popupContent, isFresh = false) {
	  const existing = vehicleMarkers.get(deviceId);

	  if (existing) {
	    // === Existing marker: Compare values ===
	    const oldLatLng = existing.getLatLng();
	    const oldIcon = existing.options.icon;

	    const oldIconUrl = (oldIcon?.options?.iconUrl || "").toLowerCase();
	    const oldRotation = parseInt(oldIcon?.options?.rotationDeg || 0);

	    const newIconUrl = (icon?.options?.iconUrl || "").toLowerCase();
	    const newRotation = parseInt(icon?.options?.rotationDeg || 0);

		// Inside applyOrUpdateMarker()
		const hasLatLngChanged = areCoordinatesDifferent(
		  oldLatLng.lat, oldLatLng.lng,
		  latlng[0], latlng[1]
		);

		const hasIconChanged = existing.options.icon !== icon;

		const popup = existing.getPopup();
		const currentPopup = (popup?.getContent() || "").trim().toLowerCase();
		const newPopup = (popupContent || "").trim().toLowerCase();
		const hasPopupChanged = currentPopup !== newPopup;

		const hasFreshChanged = existing.options._isFresh !== isFresh;

		// Skip update completely if nothing meaningful changed
		if (!hasLatLngChanged && !hasIconChanged && !hasPopupChanged && !hasFreshChanged) {
		  return;
		}


	    // ✅ Update freshness flag
	    existing.options._isFresh = isFresh;

	    // ✅ Move marker only if location changed significantly
		if (hasLatLngChanged) {
		  const wasPopupOpen = existing.isPopupOpen();
		  if (wasPopupOpen) existing.closePopup();

		  existing.setLatLng(latlng); // 👈 Directly set new position (no animation)

		  if (wasPopupOpen) existing.openPopup();
		}


	    // ✅ Update icon if different (color/type/rotation)
	    if (hasIconChanged) {
	      existing.setIcon(icon);
	    }

	    // ✅ Refresh popup content only when changed
	    if (hasPopupChanged) {
	      existing.setPopupContent(popupContent);
	    }

	  } else {
	    // === New marker: create and add ===
	    const marker = L.marker(latlng, {
	      icon,
	      _isFresh: isFresh
	    })
	    .bindPopup(popupContent)
	    .on('click', () => marker.openPopup());

	    vehicleMarkers.set(deviceId, marker);
	    clusterGroup.addLayer(marker);
	  }

	  // ✅ Always refresh cluster visual state (safe)
	  clusterGroup.refreshClusters();
	}

	function smoothMoveMarker(marker, from, to, duration = 300) {
	  const steps = 10;
	  let step = 0;

	  const interval = setInterval(() => {
	    step++;
	    const lat = from.lat + (to.lat - from.lat) * (step / steps);
	    const lng = from.lng + (to.lng - from.lng) * (step / steps);
	    marker.setLatLng([lat, lng]);

	    if (step >= steps) clearInterval(interval);
	  }, duration / steps);
	}


  }

    binary.forEach((bit, index) => {
     // console.log(`Bit ${index}: ${bit}`);
      if (bit === "1" && alertFlags[index]) {

        alerts.push({ ...alertFlags[index], bitIndex: index });
      }
    });

    return alerts;

  function initWebSocket() {
    if (window.stompClient && window.stompClient.connected) {
      window.stompClient.disconnect(() => {
        console.log("✅ WebSocket disconnected before reconnecting");
      });
    }

    setTimeout(() => {
      const socket = new SockJS('/ws');
      window.stompClient = Stomp.over(socket);
      window.stompClient.debug = null;

      window.stompClient.heartbeat.outgoing = 20000;
      window.stompClient.heartbeat.incoming = 0;

      window.stompClient.connect({}, () => {
        console.log("✅ WebSocket connected");

        fetch('/api/devices/session-role')
          .then(res => res.json())
          .then(session => {
            const authorities = session.authorities || [];
            const id = session.id;
            const roleIdMap = new Map();

            // ✅ Safe parsing of authority strings
            authorities.forEach(roleObj => {
              const roleStr = roleObj.authority || '';
              const role = roleStr.replace('ROLE_', '').toLowerCase();

              if (!roleIdMap.has(role)) {
                roleIdMap.set(role, new Set());
              }
              roleIdMap.get(role).add(id);
            });

            // ✅ Subscribe to each topic
            roleIdMap.forEach((ids, role) => {
              ids.forEach(id => {
                subscribeToWebSocket(role, id);
              });
            });
          })
		  .catch(err => {
		    console.error("❌ Failed to fetch session roles. Live tracking subscription skipped.", err);
		  });


        function subscribeToWebSocket(role, id) {
          const topic = `/topic/location-updates/${role}/${id}`;
          console.log(`🔗 Subscribing to: ${topic}`);
          window.stompClient.subscribe(topic, msg => {
            try {
              const data = JSON.parse(msg.body);
              handleWebSocketMessage(data);
            } catch (err) {
              console.error("❌ Failed to parse WebSocket message:", err);
            }
          });
        }

      }, (error) => {
        console.error("❌ WebSocket connection error:", error);
        lastSocketUpdate.clear();
        showTechnicalSupportAlert("Live vehicle tracking is temporarily unavailable. Trying to reconnect...");
        setTimeout(() => initWebSocket(), 5000);
      });
    }, 2000);
  }

  function isDeviceOffline(status, timeIntervals, lastTimestamp) {
    if (!lastTimestamp || isNaN(lastTimestamp)) return true;

    const now = new Date();
    const lastDate = new Date(lastTimestamp);

    // ✅ UTC-safe date comparison
    const isOldDate = now.getUTCFullYear() !== lastDate.getUTCFullYear() ||
                      now.getUTCMonth() !== lastDate.getUTCMonth() ||
                      now.getUTCDate() !== lastDate.getUTCDate();

    if (isOldDate) return true;

    // ✅ Set offline threshold based on timeIntervals
    let threshold = 10000; // default 10s
    if (timeIntervals) {
      const [run, park, idle] = timeIntervals.split(",").map(v => parseInt(v || 0));
      if (status === "RUNNING") {
        threshold = (run + 60) * 1000;
      } else if (status === "IDLE") {
        threshold = (idle + 60) * 1000;
      } else if (status === "PARKED") {
        threshold = (park * 60 + 60) * 1000;
      }
    }

    const elapsed = Date.now() - lastTimestamp;
    return elapsed > threshold;
  }

  let touchStartX = 0;

  document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  });

  document.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipeGesture();
  });

  function handleSwipeGesture() {
    if (!sidebar) return;

    const isCollapsed = sidebar.classList.contains('collapsed');
    const dx = touchEndX - touchStartX;
    const dy = Math.abs(touchEndY - touchStartY);

    // Only handle horizontal swipes on mobile
    if (dy > 60 || window.innerWidth > 768) return;

    if (dx > 60 && isCollapsed) {
      toggleSidebar(false); // Swipe right → open
      //if (swipeHintEl) swipeHintEl.style.display = 'none';
    } else if (dx < -60 && !isCollapsed) {
      toggleSidebar(true); // Swipe left → close
      //if (swipeHintEl) swipeHintEl.style.display = 'none';
    }
  }


});

<script>
	//idle alert
	
	
	const idleTracking = new Map(); // deviceId => { idleStart, triggered: Set }

	const IDLE_THRESHOLDS = [
	  { label: "3 Minutes", ms: 3 * 60 * 1000 },
	  { label: "15 Minutes", ms: 15 * 60 * 1000 },
	  { label: "25 Minutes", ms: 25 * 60 * 1000 },
	  { label: "45 Minutes", ms: 45 * 60 * 1000 },
	  { label: "1 Hour", ms: 60 * 60 * 1000 },
	  { label: "3 Hours", ms: 3 * 60 * 60 * 1000 },
	  { label: "5 Hours", ms: 5 * 60 * 60 * 1000 },
	  { label: "24 Hours", ms: 24 * 60 * 60 * 1000 }
	];

	// Call this for every vehicle update
	function checkIdleAlert(vehicle) {
	  const deviceId = (vehicle.deviceId || vehicle.deviceID).toUpperCase();
	  const status = (vehicle.vehicleStatus || "").toUpperCase();

	  const now = Date.now();

	  if (status === "IDLE") {
	    if (!idleTracking.has(deviceId)) {
	      idleTracking.set(deviceId, {
	        idleStart: now,
	        triggered: new Set()
	      });
	    } else {
	      const { idleStart, triggered } = idleTracking.get(deviceId);
	      const elapsed = now - idleStart;

	      IDLE_THRESHOLDS.forEach(threshold => {
	        if (elapsed >= threshold.ms && !triggered.has(threshold.ms)) {
	          triggered.add(threshold.ms);

	          // Show SweetAlert
			  Swal.fire({
			    icon: "warning",
			    title: "Idle Alert",
			    html: `
			      <b>Device:</b> ${deviceId}<br>
			      <b>Status:</b> IDLE<br>
			      <b>Duration:</b> ${threshold.label}
			    `,
			    timer: 5000,
			    toast: true,
			    position: 'bottom', // ✅ Use bottom for center position
			    showConfirmButton: false,
			    background: '#fff',
			    color: '#000',
			    customClass: {
			      popup: 'idle-toast-popup'
			    }
			  });

	        }
	      });
	    }
	  } else {
	    // Reset on any status change
	    if (idleTracking.has(deviceId)) {
	      idleTracking.delete(deviceId);
	    }
	  }
	}
