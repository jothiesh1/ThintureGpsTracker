	<header th:insert="navigation_dealer :: navbar_dealer"></header>

<div class="card">
	<div class="main-heading">Vehicle & Driver Monitoring</div>

    <div id="use-normal" class="report-grid">
        <div class="report-card" id="event">
            <img src="/THINTURE_IMAGE/eventsr.png" alt="Event Report">
            <span>Event status Report</span>
        </div>
		
		
       
		
        <div class="report-card" id="complaint">
            <img src="/THINTURE_IMAGE/complaintsr.png" alt="Parking Report">
            <span>Complaints Report</span>
        </div>
		
        <div class="report-card" id="vehicleReport">
            <img src="/THINTURE_IMAGE/vviolationr.png" alt="Vehicle Report">
            <span>Vehicle Violation Report</span>
        </div>
        
		<div class="report-card" id="install">
		           <img src="/THINTURE_IMAGE/installr.png" class="install" alt="Historical Data">
		           <span>Install Report </span>
		       </div>
    </div>

    
</div>
<br>
<br>
<div class="card">
	<div class="main-heading">Users Management</div>

    <div id="use-normal" class="report-grid">
        
		
		
        <div class="report-card" id="client">
            <img src="/THINTURE_IMAGE/clientr.png" class="install" alt="Historical Data">
            <span>Client</span>
        </div>
		
        <div class="report-card" id="user">
            <img src="/THINTURE_IMAGE/usersr.png" alt="Parking Report">
            <span>Users</span>
        </div>
		
       
       
        
    </div>

    
</div>

<script>
	function showTab(tabId) {
	       document.querySelectorAll('.tab-buttons button').forEach(button => {
	           button.classList.remove('active');
	       });
	       document.querySelectorAll('.report-grid').forEach(grid => {
	           grid.style.display = 'none';
	       });
	       document.getElementById(tabId).style.display = 'grid';
	       event.target.classList.add('active');
	   }

	   function openReport(reportName) {
		alert(`Opening ${reportName}...`);

	   }
	  
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById('event').addEventListener('click', function() {
            window.location.href = '/dealer/event';
        });
		document.getElementById('complaint').addEventListener('click', function() {
				            window.location.href = ' /dealer/view_complaints'; // or 'vehicle_violation.html' if static file
				        });
		
		document.getElementById('install').addEventListener('click', function() {
		            window.location.href = ' /dealer/device_report'; // or 'vehicle_violation.html' if static file
		        });

        document.getElementById('vehicleReport').addEventListener('click', function() {
            window.location.href = '/dealer/vehicle_violation'; // or 'vehicle_violation.html' if static file
        });

        
		
		
			  
			   
			   
					 
			   
			   
							   document.getElementById('client').addEventListener('click', function() {
							               window.location.href = '/dealer/client_view';
							           });

									               window.location.href = '/dealer/user_view';
									           });
			   
											  
			   
			   
			   
			   
			   
			   
			   
			   
			   
			   
        // Only attach if the element exists (your video is commented out in HTML)

            });

    });
</script>
