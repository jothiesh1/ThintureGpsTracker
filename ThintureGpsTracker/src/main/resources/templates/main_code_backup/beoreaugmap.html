<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
	
	
	

	let isInitialLoad = true;
	const map = L.map('map', {
	  center: [13.07800,77.55933
],
	  zoom: 5,
	  zoomControl: false,
	  dragging: true,
	  touchZoom: true,
	  tap: true,
	});


  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  const clusterGroup = L.markerClusterGroup({
    iconCreateFunction: cluster => L.divIcon({
      html: `<div class="custom-cluster">${cluster.getChildCount()}</div>`,
      className: 'custom-cluster',
      iconSize: [40, 40]
    }),

    // ✅ Prevent immediate reclustering after user zooms/moves
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    disableClusteringAtZoom: 17, // Optional: full device separation at close zoom
    animate: true,
    animateAddingMarkers: true,

    // ✅ Delay cluster regrouping when map is zoomed or moved
    maxClusterRadius: 60 // Smaller = easier to split clusters
  });

  map.addLayer(clusterGroup);

  const stompRole = 'superadmin';
  const stompId = 1;

  const vehicleMarkers = new Map();
  const vehiclePositions = new Map();
  const lastSocketUpdate = new Map();

  




  function getVehicleIcon(course, status, vehicleType = "", model = "") {
    const color = status === 'RUNNING' ? 'green'
                : (status === 'IDLE' || status === 'PARKED') ? 'orange'
                : 'red';

    let baseName = "car0";
    let folder = "car";

    const normalizedType = (vehicleType || "").trim().toUpperCase();
    console.log(`🚗 [VehicleType Raw]: "${vehicleType}" → Normalized: "${normalizedType}"`);

    switch (normalizedType) {
      case "BIKE":
      case "TWO_WHEELER":
        baseName = "bike0";
        folder = "Bike";
        break;

      case "TRUCK":
      case "LORRY":
        baseName = "truck0";
        folder = "Truck";
        break;

      case "BUS":
        baseName = "bus0";
        folder = "Bus";
        break;

      case "AUTO":
      case "THREE_WHEELER":
        baseName = "auto0";
        folder = "Auto";
        break;

      case "TRACTOR":
        baseName = "tractor0";
        folder = "Tractor";
        break;

      case "SCOOTER":
        baseName = "scooter0";
        folder = "Scooter";
        break;

      default:
        baseName = "car0";
        folder = "car";
    }

    const iconPath = `/THINTURE_IMAGE/${folder}/${color}/${baseName}.png`;
    console.log(`📍 [Icon Path]: ${iconPath}`);

    return L.divIcon({
      html: `
        <div style="
          width: 48px;
          height: 48px;
          transform: rotate(${course}deg);
          transition: transform 0.3s ease;
        ">
          <img src="${iconPath}" style="width: 38px; height: 38px;">
        </div>
      `,
      className: 'gps-car-icon',
      iconSize: [48, 48],
      iconAnchor: [24, 24],
      popupAnchor: [0, -20]
    });
  }


  function getGsmLabel(gsm) {
    gsm = parseInt(gsm);
    if (gsm >= 70) return "High";
    if (gsm >= 30) return "Medium";
    return "Low";
  }

  function getGsmColor(gsm) {
    gsm = parseInt(gsm);
    if (gsm >= 70) return "#28a745"; // Green
    if (gsm >= 30) return "#ffc107"; // Orange
    return "#dc3545"; // Red
  }
  function formatTime(ts) {
    // If the timestamp is invalid, return 'Unknown'
    if (!ts || isNaN(ts)) return "Unknown";

    // Create a new Date object using the timestamp
    const date = new Date(ts);

    // Format the date to 'YYYY-MM-DD HH:MM:SS UTC' format in UTC
    return date.toISOString().replace("T", " ").substring(0, 19) + " ";
  }




  function createOrUpdateMarker(vehicle) {
       const deviceId = (vehicle.deviceId || vehicle.deviceID || "").toUpperCase();
       const lat = parseFloat(vehicle.latitude);
       const lng = parseFloat(vehicle.longitude);
       const latlng = [lat, lng];
       const course = parseFloat(vehicle.course || 0);
       const speed = vehicle.speed || "0";
       const gsm = vehicle.gsmStrength || "--";
    const ignStatus = (vehicle.ignition || "").toString().trim().toUpperCase();
    console.log("Device:", deviceId, "ignitionStatus:", ignStatus);

    const isIgnitionOn = ignStatus === "IGON";
    const ignitionDisplay = isIgnitionOn ? "ON" : "OFF";
    const ignitionColor = isIgnitionOn ? "#28a745" : "#dc3545";


   	const recordTs = new Date(vehicle.timestamp).getTime();
   	const socketTs = lastSocketUpdate.get(deviceId);

   	let effectiveTimestamp = recordTs;
   	if (typeof socketTs === "number" && !isNaN(socketTs) && socketTs > recordTs) {
   	  effectiveTimestamp = socketTs;
   	}

   	if (!effectiveTimestamp || isNaN(effectiveTimestamp)) {
   	  console.warn("⛔ Invalid timestamp for device:", deviceId, vehicle.timestamp);
   	  return;
   	}



   	

       const rawStatus = (vehicle.vehicleStatus || "UNKNOWN").toUpperCase();
       let status = rawStatus;

       // ✅ Parse timeIntervals for display and threshold
       let runSec = 0, parkMin = 0, idleSec = 0;
       let runTime = "0s", parkTime = "0m", idleTime = "0s";

  function decodeAdditionalData(bitStr) {
    const alerts = [];

    if (!bitStr || typeof bitStr !== "string") return alerts;

    const binary = bitStr.padStart(8, "0").split("").reverse();

    binary.forEach((bit, index) => {

  function isDeviceOffline(status, timeIntervals, lastTimestamp) {
    if (!lastTimestamp || isNaN(lastTimestamp)) return true;

    const now = new Date();
    const lastDate = new Date(lastTimestamp);

    // ✅ UTC-safe date comparison
    const isOldDate = now.getUTCFullYear() !== lastDate.getUTCFullYear() ||
                      now.getUTCMonth() !== lastDate.getUTCMonth() ||
                      now.getUTCDate() !== lastDate.getUTCDate();

    if (isOldDate) return true;

    // ✅ Set offline threshold based on timeIntervals
    let threshold = 10000; // default 10s
    if (timeIntervals) {
      const [run, park, idle] = timeIntervals.split(",").map(v => parseInt(v || 0));
      if (status === "RUNNING") {
        threshold = (run + 60) * 1000;

        threshold = (idle + 60) * 1000;
      } else if (status === "PARKED") {

      }
    }

    const elapsed = Date.now() - lastTimestamp;
    return elapsed > threshold;
  }

  // 🔔 Internet lost alert

  // ✅ Store user voice preference (default = true)

  localStorage.setItem('voiceEnabled', 'false');
  

  let selectedVoiceURI = localStorage.getItem('selectedVoiceURI') || null;

  // ✅ Load available voices and populate select
  function populateVoiceList() {
    const voices = speechSynthesis.getVoices();
    const select = document.getElementById('voiceSelect');
    select.innerHTML = `<option value="">🔈 Select Voice Language</option>`; // reset

    voices.forEach(voice => {
      const option = document.createElement('option');
      option.textContent = `${voice.name} (${voice.lang}) ${voice.default ? '[Default]' : ''}`;
      option.value = voice.voiceURI;
      if (voice.voiceURI === selectedVoiceURI) option.selected = true;
      select.appendChild(option);
    });
  }

  // ✅ Save selected voice
  document.getElementById('voiceSelect').addEventListener('change', (e) => {
    selectedVoiceURI = e.target.value;
    localStorage.setItem('selectedVoiceURI', selectedVoiceURI);
    speak("Voice selected.");
  });

  // ✅ Main speak() function using selected voice
  function speak(text) {
    if ('speechSynthesis' in window && isVoiceEnabled) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.2;
      utterance.rate = 1.0;

      const voices = speechSynthesis.getVoices();
      if (selectedVoiceURI) {
        const voice = voices.find(v => v.voiceURI === selectedVoiceURI);
        if (voice) utterance.voice = voice;
      }

      speechSynthesis.speak(utterance);
    }
  }

  // ✅ Trigger voice loading
  window.speechSynthesis.onvoiceschanged = populateVoiceList;

  // ✅ Also run on DOM ready (in case voices load instantly)
  document.addEventListener('DOMContentLoaded', populateVoiceList);

    toggleBtn.addEventListener('click', () => {

      if (isVoiceEnabled) speak("Voice alerts enabled.");

    // ✅ Initial internet state check
    const wasOffline = localStorage.getItem('wasOffline') === 'true';

      showInternetLostAlert();

      localStorage.setItem('wasOffline', 'true');
    } else if (wasOffline) {

  let lastOfflineCount = 0;

  function updateCounts() {
	const counts = { RUNNING: 0, IDLE: 0, PARKED: 0, OFFLINE: 0, LIVE: 0 };

	vehicleDataMap.forEach(vehicle => {
	  const id = (vehicle.deviceId || vehicle.deviceID || "").toUpperCase();
	  let status = (vehicle.vehicleStatus || "UNKNOWN").toUpperCase();
	  const ts = lastSocketUpdate.get(id);

	  const isOffline = isDeviceOffline(status, vehicle.timeIntervals, ts);
	  const isFresh = ts && (Date.now() - ts <= 4000);

	  if (isOffline) {
	    counts.OFFLINE++;
	  } else {
	    if (status === "RUNNING") counts.RUNNING++;
	    else if (status === "IDLE") counts.IDLE++;
	    else if (status === "PARKED") counts.PARKED++;
	  }

	  if (!isOffline && isFresh) {
	    counts.LIVE++;
	  }
	});


    // Update DOM counts
    document.getElementById("totalVehicles").textContent   = vehicleDataMap.size;
	document.getElementById("liveVehicles").textContent = counts.LIVE;

    document.getElementById("runningVehicles").textContent = counts.RUNNING;
    document.getElementById("idleVehicles").textContent    = counts.IDLE;
    document.getElementById("parkedVehicles").textContent  = counts.PARKED;
    document.getElementById("offlineVehicles").textContent = counts.OFFLINE;

    // Alert if offline spike
   // if (counts.OFFLINE - lastOfflineCount >= 3) {
    //  showTechnicalSupportAlert("⚠️ Multiple vehicles have gone offline recently. Please check your connectivity or device status.");
   // }

    lastOfflineCount = counts.OFFLINE;
  }
  let modalDeviceData = [];
  let modalCurrentPage = 1;
  const modalPageSize = 5;

  function showDevicesByStatus(targetStatus) {
    modalCurrentPage = 1;
    modalDeviceData = [];

    vehicleDataMap.forEach((vehicle, key) => {
      const id = (vehicle.deviceId || vehicle.deviceID || "").toUpperCase();
      const rawStatus = (vehicle.vehicleStatus || "UNKNOWN").toUpperCase();
      const ts = lastSocketUpdate.get(id);

      let status = rawStatus;
      if (isDeviceOffline(rawStatus, vehicle.timeIntervals, ts)) {
        status = "OFFLINE";
      }

      const isFresh = ts && (Date.now() - ts <= 4000);

      const include =
        targetStatus === "TOTAL" ? true :
        targetStatus === "LIVE" ? isFresh && status !== "OFFLINE" :
        targetStatus === status;

      if (include) {
        modalDeviceData.push({
          id,
          ts,
          status,
          time: ts ? new Date(ts).toISOString().replace("T", " ").substring(0, 19) : "N/A"
        });
      }
    });

    document.getElementById("statusDeviceModalLabel").textContent = `${targetStatus} Devices (${modalDeviceData.length})`;

    renderModalPage(); // ⬅️ show first page
    new bootstrap.Modal(document.getElementById('statusDeviceModal')).show();
  }
  function renderModalPage() {
    const listEl = document.getElementById("modalDeviceList");
    const pageInfo = document.getElementById("modalPageInfo");
    const prevBtn = document.getElementById("modalPrevBtn");
    const nextBtn = document.getElementById("modalNextBtn");

    listEl.innerHTML = "";

    const totalPages = Math.ceil(modalDeviceData.length / modalPageSize);
    const start = (modalCurrentPage - 1) * modalPageSize;
    const end = start + modalPageSize;
    const pageItems = modalDeviceData.slice(start, end);

    if (pageItems.length === 0) {
      listEl.innerHTML = `<div class="text-danger fw-semibold text-center">No devices found.</div>`;
    } else {
      pageItems.forEach(d => {
        listEl.insertAdjacentHTML("beforeend", `
          <div class="list-group-item d-flex justify-content-between align-items-center">
            <div><strong>${d.id}</strong><br><small class="text-muted">${d.time}</small></div>
            <button class="btn btn-sm btn-outline-primary" onclick="zoomTo('${d.id}')" data-bs-dismiss="modal">Zoom</button>
          </div>
        `);
      });
    }

    pageInfo.textContent = `Page ${modalCurrentPage} of ${totalPages || 1}`;
    prevBtn.disabled = modalCurrentPage <= 1;
    nextBtn.disabled = modalCurrentPage >= totalPages;
  }

  function openDetails(deviceId) {
    if (!deviceId) return;

    const modalList = document.getElementById("modalDeviceList");

    // Show spinner while loading
    modalList.innerHTML = `
      <div class="d-flex justify-content-center align-items-center py-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    `;

    // Show the modal immediately with spinner
    document.getElementById("statusDeviceModalLabel").textContent = `Details - ${deviceId}`;
    document.getElementById("modalPrevBtn").style.display = "none";
    document.getElementById("modalNextBtn").style.display = "none";
    document.getElementById("modalPageInfo").style.display = "none";
    new bootstrap.Modal(document.getElementById('statusDeviceModal')).show();

    const detailsUrl = `/api/details/${deviceId}`;
    const kmUrl = `/api/vehicle/last/latests-locations/all?deviceId=${deviceId}`;

    Promise.all([
      fetch(detailsUrl).then(res => res.json()),
      fetch(kmUrl).then(res => res.json())
    ])
    .then(([details, distance]) => {
      const km = distance?.totalKm || "0";

      const modalContent = `
        <div class="list-group-item">
          <div><strong>Vehicle Number:</strong> ${details.deviceID || "N/A"}</div>
          <div><strong>Owner:</strong> ${details.ownerName || "N/A"}</div>
          <div><strong>Total Distance:</strong> ${km || "N/A"} km</div>
          <div><strong>Time Intervals:</strong> ${details.timeIntervals || "N/A"}</div>
          <div><strong>GSM Strength:</strong> ${details.gsmStrength || "N/A"}</div>
          <div><strong>IMEI:</strong> ${details.imei || "N/A"}</div>
          <div><strong>Vehicle Model:</strong> ${details.model || "N/A"}</div>
		  <div><strong>Vehicle Type:</strong> ${details.vehicleType || "N/A"}</div>
        </div>
      `;

      modalList.innerHTML = modalContent;
    })
    .catch(err => {
      console.error("❌ Error fetching details:", err);
      modalList.innerHTML = `<div class="text-danger fw-semibold text-center">Failed to load details.</div>`;
    });
  }




</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const icon = document.getElementById('toggleIcon');
  const swipeHintEl = document.getElementById('swipeHint');

  // Collapse sidebar on first mobile load
  if (window.innerWidth <= 768 && sidebar && overlay) {
    sidebar.classList.add('collapsed');
    overlay.style.display = "none";
    if (icon) {
      icon.classList.remove('fa-times');
      icon.classList.add('fa-bars');
    }
  }

  
  let sidebarVisible = true;

  

	function toggleSidebar(forceClose = false) {
	  const sidebar = document.getElementById('sidebar');
	  const toggleBtn = document.getElementById('sidebarToggleBtn');
	  const toggleIcon = document.getElementById('toggleIcon');

	  const isCollapsed = sidebar.classList.contains('collapsed');

	  if (forceClose || !isCollapsed) {
	    sidebar.classList.add('collapsed');
	    toggleBtn.style.left = '0';
	    toggleIcon.textContent = '+'; // show plus when closed
	  } else {
	    sidebar.classList.remove('collapsed');
	    toggleBtn.style.left = '320px';
	    toggleIcon.textContent = '−'; // show minus when open
	  }
	}

  



 



  window.toggleSidebar = toggleSidebar; // make globally available

  // === Swipe Gesture Support ===
  let touchStartX = 0;
  let touchStartY = 0;
  let touchEndX = 0;
  let touchEndY = 0;

  document.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  });

  document.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipeGesture();
  });

  function handleSwipeGesture() {
    if (!sidebar) return;

    const isCollapsed = sidebar.classList.contains('collapsed');
    const dx = touchEndX - touchStartX;
    const dy = Math.abs(touchEndY - touchStartY);

    // Only handle horizontal swipes on mobile
    if (dy > 60 || window.innerWidth > 768) return;

    if (dx > 60 && isCollapsed) {
      toggleSidebar(false); // Swipe right → open
      if (swipeHintEl) swipeHintEl.style.display = 'none';
    } else if (dx < -60 && !isCollapsed) {
      toggleSidebar(true); // Swipe left → close
      if (swipeHintEl) swipeHintEl.style.display = 'none';
    }
  }

  // === Show swipe hint on mobile ===
  if (window.innerWidth <= 768 && swipeHintEl) {
    swipeHintEl.style.display = 'block';
    setTimeout(() => {
      swipeHintEl.style.display = 'none';
    }, 10000);
  }
});
</script>
